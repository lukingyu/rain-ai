server:
  port: 8080

spring:
  application:
    name: rain-ai
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/rain_ai
    username: rain
    password: rain_pwd
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  ai:
    model:
      chat: openai
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
#      api-key: ${OPENAI_API_KEY:replace-with-your-api-key}
#      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        api-key: ${DEEPSEEK_API_KEY:replace-with-your-api-key}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        options:
          model: deepseek-v4-flash
          temperature: 0.1
          extra-body:
            thinking:
              type: disabled
      embedding:
        api-key: ${DASHSCOPE_API_KEY:replace-with-your-api-key}
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        options:
          model: text-embedding-v4
          dimensions: 1536
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: rain_ai_vector_store
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        index-type: HNSW

rain:
  ai:
    task:
      default-timeout-seconds: 120
    storage:
      upload-dir: data/uploads
    rocketmq:
      name-server: localhost:9876
      producer-group: rain-ai-producer-group
      document-consumer-group: rain-ai-document-ingestion-consumer-group
      topics:
        document-ingestion: rain-ai-document-ingestion
